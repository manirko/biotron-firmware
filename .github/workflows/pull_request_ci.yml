# Source: projects/biotron-paul-7818/proposals/firmware-pull-request-ci.yml (reviewed 2026-08-28 for 0e318a8).
# Internal 1.10.10 build parameters match the frozen 2ae1973 A06-A08/Fibonacci candidate.
# CI uses its recorded Ubuntu toolchain; its UF2 is not the frozen macOS-built UF2.
# This workflow never releases or replaces a delivered artifact.
name: Firmware candidate checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-candidate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-and-pico-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PICO_SDK_COMMIT: 98a542c1a62fb549ffb5d66a3e5892b06276b670
      BIOTRON_FLASH_ID: 1765723554
      BIOTRON_VERSION_MAJOR: 1
      BIOTRON_VERSION_MINOR: 10
      BIOTRON_VERSION_PATCH: 10
      PICO_BOARD: pico
      BIOTRON_LED_MUSIC_PULSE: "ON"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run deterministic host tests
        env:
          CC: clang
        run: |
          test -x tests/run_host_tests.sh
          tests/run_host_tests.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib ninja-build python3

      - name: Fetch exact Pico SDK commit
        run: |
          git init "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" remote add origin \
            https://github.com/raspberrypi/pico-sdk.git
          git -C "$RUNNER_TEMP/pico-sdk" fetch --depth 1 origin "$PICO_SDK_COMMIT"
          git -C "$RUNNER_TEMP/pico-sdk" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1
          test "$(git -C "$RUNNER_TEMP/pico-sdk" rev-parse HEAD)" = "$PICO_SDK_COMMIT"

      - name: Build exact candidate
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S . -B build -G Ninja \
            -DPICO_BOARD="$PICO_BOARD" \
            -DBIOTRON_FLASH_ID="$BIOTRON_FLASH_ID" \
            -DBIOTRON_VERSION_MAJOR="$BIOTRON_VERSION_MAJOR" \
            -DBIOTRON_VERSION_MINOR="$BIOTRON_VERSION_MINOR" \
            -DBIOTRON_VERSION_PATCH="$BIOTRON_VERSION_PATCH" \
            -DBIOTRON_LED_MUSIC_PULSE="$BIOTRON_LED_MUSIC_PULSE" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Release
          python3 - <<'PY'
          import json, os, pathlib, shlex
          expected = {
              "FLASH_ID_STARTUP": os.environ["BIOTRON_FLASH_ID"],
              "MAJOR_VERSION": os.environ["BIOTRON_VERSION_MAJOR"],
              "MINOR_VERSION": os.environ["BIOTRON_VERSION_MINOR"],
              "PATCH_VERSION": os.environ["BIOTRON_VERSION_PATCH"],
              "BIOTRON_LED_MUSIC_PULSE": "1",
              "PICO_BOARD": f'"{os.environ["PICO_BOARD"]}"',
              "PICO_RP2040": "1",
          }
          required = {"src/params.c", "src/leds.c", "src/music.c"}
          root = pathlib.Path.cwd()
          for entry in json.loads(pathlib.Path("build/compile_commands.json").read_text()):
              path = pathlib.Path(entry["file"])
              relative = path.relative_to(root).as_posix() if path.is_relative_to(root) else ""
              if relative not in required:
                  continue
              arguments = entry.get("arguments") or shlex.split(entry["command"])
              for name, value in expected.items():
                  actual = [arg for arg in arguments if arg.startswith(f"-D{name}=")]
                  if actual != [f"-D{name}={value}"]:
                      raise SystemExit(f"{relative}: {name} compiler definitions {actual} != {value}")
              required.remove(relative)
          if required:
              raise SystemExit(f"Missing runtime compile units: {sorted(required)}")
          print("Runtime compiler definitions match the declared candidate identity")
          PY
          cmake --build build --parallel 2
          test -s build/biotron.uf2
          test -s build/biotron.elf
          test -z "$(git status --short --untracked-files=no)"

      - name: Create evidence manifest
        run: |
          mkdir -p candidate
          cp build/biotron.uf2 build/biotron.elf candidate/
          cp build/CMakeCache.txt build/compile_commands.json candidate/
          git rev-parse HEAD > candidate/firmware-commit.txt
          git -C "$RUNNER_TEMP/pico-sdk" rev-parse HEAD > candidate/pico-sdk-commit.txt
          arm-none-eabi-gcc --version > candidate/toolchain.txt
          cmake --version > candidate/cmake.txt
          dpkg-query -W \
            build-essential cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib ninja-build python3 \
            > candidate/debian-packages.txt
          sha256sum candidate/biotron.uf2 candidate/biotron.elf \
            > candidate/SHA256SUMS
          {
            echo "repository=${{ github.repository }}"
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "pico_sdk_commit=$PICO_SDK_COMMIT"
            echo "settings_compatibility_id=$BIOTRON_FLASH_ID"
            echo "candidate_version=$BIOTRON_VERSION_MAJOR.$BIOTRON_VERSION_MINOR.$BIOTRON_VERSION_PATCH"
            echo "pico_board=$PICO_BOARD"
            echo "led_music_pulse=$BIOTRON_LED_MUSIC_PULSE"
            echo "build_type=Release"
            echo "FROZEN_DELIVERY_UF2=false"
            echo "NOT_A_RELEASE=true"
          } > candidate/BUILD-IDENTITY.txt

      - name: Upload test artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: biotron-test-candidate-${{ github.run_id }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
